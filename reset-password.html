<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Mieza</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mieza-unified-theme.css">
<style>
.reset-wrap{min-height:75vh;display:grid;place-items:center;padding:32px 16px}.reset-card{width:min(100%,460px);background:var(--card-bg,#fff);color:var(--text-color,#172033);padding:30px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.10)}.reset-card h2{margin:0 0 10px}.reset-card p{line-height:1.55}.reset-card label{display:block;margin:16px 0 6px;font-weight:600}.reset-card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.reset-card button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#0b5cff;color:#fff;font-weight:700;cursor:pointer}.reset-card button:disabled{opacity:.65;cursor:wait}.reset-message{margin-top:14px;padding:11px;border-radius:8px;display:none}.reset-message.error{display:block;background:#fee2e2;color:#991b1b}.reset-message.success{display:block;background:#dcfce7;color:#166534}.reset-back{display:inline-block;margin-top:18px}
</style>
</head>
<body>
<header class="auth-header"><h1 class="logo">Mieza</h1><a class="back-link" href="index.html">← Back to Mieza</a></header>
<main class="reset-wrap"><section class="reset-card">
<h2 id="pageTitle">Forgot your password?</h2>
<p id="pageIntro">Enter the email address registered to your Mieza account. We will email you a secure password reset link.</p>
<form id="requestForm">
<label for="email">Registered email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
<button id="requestBtn" type="submit">Send reset link</button>
</form>
<form id="confirmForm" hidden>
<label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="At least 8 characters">
<label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Enter the password again">
<button id="confirmBtn" type="submit">Save new password</button>
</form>
<div id="message" class="reset-message" role="status" aria-live="polite"></div>
<a id="backToLogin" class="reset-back" href="shop-login.html">Back to login</a>
</section></main>
<script src="js/reset-password.js"></script>
</body></html>
