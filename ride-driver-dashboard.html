<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mieza Ride Driver Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="favicon.png">

</head>

<body>

<header class="dashboard-header">
  <h1>Mieza Ride</h1>

  <button id="logoutBtn">
    Logout
  </button>
</header>

<main class="dashboard-container">

  <h2>
   Welcome Driver
  </h2>

  <!-- Driver Status -->

  <section class="status-card">

    <h3>
      Driver Status
    </h3>

    <p id="driverStatus">
      Offline
    </p>

    <button id="toggleAvailability">
      Go Online
    </button>

  </section>

  <!-- Today's Earnings -->

  <section class="earnings-card">

    <h3>
      Today's Earnings
    </h3>

    <h1>
      ₵0.00
    </h1>

  </section>

  <!-- Ride Requests -->

  <section class="requests-card">

    <h3>
      Incoming Ride Requests
    </h3>

    <div id="rideRequests">
      No ride requests.
    </div>
  </section>

  <!-- Ride History -->

  <section class="history-card">

    <h3>
      Ride History
    </h3>

    <div id="rideHistory">
      No completed rides yet.
    </div>

  </section>

</main>

<script src="js/ride-driver-dashboard.js"></script>

</body>
</html>
