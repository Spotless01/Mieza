<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ride Driver Login</title>

<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="favicon.png">

</head>

<body>

<div class="login-card">

  <h1>Mieza Ride</h1>

  <h2>Driver Login</h2>

  <input
  type="email"
  id="email"
  placeholder="Email">

  <input
  type="password"
  id="password"
  placeholder="Password">

  <button id="loginBtn">
    Login
  </button>

  <p>
    Don't have an account?
    <a href="ride-register.html">
      Register Here
    </a>
  </p>

</div>

<script src="js/ride-driver-login.js"></script>

</body>

</html>
