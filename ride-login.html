<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mieza Ride Driver Login</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/shop-register.css">

</head>

<body>

<header class="auth-header">

<h1 class="logo">Mieza</h1>

<a href="index.html" class="back-link">
← Back
</a>

</header>

<section class="register-section">

<div class="register-card">

<h2>Ride Driver Login</h2>

<form id="rideLoginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button
type="submit"
id="loginBtn"
>
Login
</button>

</form>

<p style="margin-top:20px;text-align:center;">

Don't have an account?

<a href="ride-register.html">

Register Here

</a>

</p>

</div>

</section>

<script src="js/ride-login.js"></script>

</body>
</html>
