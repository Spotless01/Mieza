<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rider Login - Mieza</title>

<link rel="stylesheet"
href="css/style.css">

 <link rel="icon" type="image/png" href="favicon.png">

</head>

<body>

<div class="rider-login-page">

  <div class="rider-login-card">

    <div class="login-logo">

      <h1>Rider | Driver Login</h1>

      <p>
        Visit dashboard to accept and complete pending deliveries as well as track your earnings.
      </p>

    </div>

    <div class="input-group">

      <label>Email</label>

      <input
      id="email"
      type="email"
      placeholder="Enter your email"
      >

    </div>

    <div class="input-group">

      <label>Password</label>

      <input
      id="password"
      type="password"
      placeholder="Enter your password"
      >

    </div>

    <button
      type="button"
      id="riderLoginBtn"
      class="login-btn"
      onclick="loginRider()"
    >
      Login
    </button>

    <p class="login-footer">
      New rider?
      <a href="rider-register.html">Create rider account</a>
    </p>

  </div>

</div>

<script src="js/rider-login.js"></script>

</body>

</html>
