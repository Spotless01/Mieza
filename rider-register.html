<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Registration - Mieza</title>
  <link rel="stylesheet" href="css/style.css">

   <link rel="icon" type="image/png" href="favicon.png">

   <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>

<div class="rider-register-page">

<div class="register-card">

<div class="register-header">

<h1>Become a Mieza Rider</h1>

<p class="intro">
Loading registration details...
</p>

</div>


<!-- PERSONAL DETAILS -->

<div class="section-title">
Personal Information
</div>

<div class="input-group">
<label>Full Name</label>
<input id="fullName" type="text">
</div>

<div class="input-group">
<label>Phone Number</label>
<input id="phone" type="tel">
</div>

<div class="input-group">
<label>Email Address</label>
<input id="email" type="email">
</div>

<div class="input-group">
<label>Password</label>
<input id="password" type="password">
</div>


<div class="input-group">
<label>Profile Photo</label>
<input
id="profilePhoto"
type="file"
accept="image/*">
</div>



<!-- LOCATION -->

<div class="section-title">
Current Location
</div>

<div class="input-group">

<label>Location</label>

<input
id="currentLocation"
readonly>

<input
type="hidden"
id="latitude">

<input
type="hidden"
id="longitude">

<button
type="button"
id="getRideDriverLocation"
class="secondary-btn">

📍 Use My Current Location

</button>

<div id="locationStatus"></div>

</div>



<!-- VEHICLE -->

<div class="section-title">
Vehicle Details
</div>

<div class="input-group">

<label>Vehicle Type</label>

<select id="vehicleType">

<option value="motorbike">
Motorbike
</option>

<option value="car">
Car
</option>

<option value="bicycle">
Bicycle
</option>

</select>

</div>


<div class="input-group">

<label>Vehicle Brand</label>

<input id="vehicleBrand">

</div>


<div class="input-group">

<label>Vehicle Model</label>

<input id="vehicleModel">

</div>


<div class="input-group">

<label>Vehicle Color</label>

<input id="vehicleColor">

</div>


<div class="input-group">

<label>Plate Number</label>

<input id="plateNumber">

</div>


<div class="input-group">

<label>Vehicle Photos</label>

<input

id="vehiclePhotos"

multiple

accept="image/*"

type="file">

</div>



<!-- DOCUMENTS -->

<div class="section-title">
Driver Verification
</div>

<div class="input-group">

<label>Driver License Number</label>

<input id="driverLicenseNumber">

</div>


<div class="input-group">

<label>Ghana Card Number</label>

<input id="nationalIdNumber">

</div>



<!-- PAYOUT -->

<div class="section-title">
Payout Method
</div>

<div class="input-group">

<label>Payout Method</label>

<select id="payoutMethod">

<option value="momo">
Mobile Money
</option>

<option value="bank">
Bank Account
</option>

</select>

</div>



<div id="momoFields">

<div class="input-group">

<label>MoMo Number</label>

<input id="momoNumber">

</div>

<div class="input-group">

<label>Name on MoMo</label>

<input id="momoName">

</div>

<div class="input-group">

<label>Network</label>

<select id="momoNetwork">

<option value="MTN">MTN</option>

<option value="Telecel">Telecel</option>

<option value="AirtelTigo">AirtelTigo</option>

</select>

<input
type="hidden"
id="momoBankCode">

</div>

</div>



<div
id="bankFields"
style="display:none;">

<div class="input-group">

<label>Bank Name</label>

<input id="bankName">

<input
type="hidden"
id="bankCode">

</div>

<div class="input-group">

<label>Account Name</label>

<input id="accountName">

</div>

<div class="input-group">

<label>Account Number</label>

<input id="accountNumber">

</div>

</div>



<!-- TERMS -->

<div class="terms-box">

<label>

<input
type="checkbox"
id="agreeTerms">

I agree to the

<a href="#" id="viewTerms">

Terms & Conditions

</a>

</label>

</div>



<button
id="payAndRegisterBtn"
class="login-btn"

type="button">

Loading...

</button>



<p class="login-footer">

Already registered?

<a href="rider-login.html">

Login

</a>

</p>

</div>

</div>



<!-- TERMS MODAL -->

<div
id="termsModal"
class="terms-modal">

<div class="terms-content">

<div class="terms-header">

<h2>

Terms & Conditions

</h2>

<button id="closeTerms">

✕

</button>

</div>

<div
id="termsText"
class="terms-body">

Loading...

</div>

<button
id="acceptTermsBtn">

I Understand

</button>

</div>

</div>



<script src="js/rider-register.js"></script>

</body>
</html>
